server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: consumer-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:bank-ledger-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        isolation.level: read_committed
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
        specific.avro.reader: true
    listener:
      ack-mode: record
      concurrency: 3

app:
  kafka:
    transfer-topic: bank.transfer.requested.v1
    consumer-group: ${KAFKA_CONSUMER_GROUP:bank-ledger-v1}
